name: release-vulkan

on:
  push:
    tags:
      - "vulkan-*"
      - "v0.1*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1, vulkan-0.1)"
        required: false
        default: "vulkan-0.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          cache-cleanup: always

      - name: Gradle build (release jar)
        run: GITHUB_ACTIONS=true ./gradlew clean build

      - name: List jars
        run: ls -lh build/libs/

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: voxy_vulkan-0.1
          path: build/libs/voxy_vulkan-0.1.jar
          archive: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Voxy Vulkan ${{ inputs.tag || github.ref_name }}
          files: build/libs/voxy_vulkan-0.1.jar
          generate_release_notes: true
          draft: false
          prerelease: true
